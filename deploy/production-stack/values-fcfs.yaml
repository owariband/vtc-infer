servingEngineSpec:
  enableEngine: true
  runtimeClassName: nvidia
  imagePullPolicy: IfNotPresent
  strategy:
    type: Recreate
  modelSpec:
    - name: qwen25-15b
      enabled: true
      repository: localhost:5000/vtc-infer-vllm
      tag: MUST_BE_OVERRIDDEN_WITH_TAG_AND_DIGEST
      modelURL: Qwen/Qwen2.5-1.5B-Instruct
      modelRevision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
      replicaCount: 1
      runtimeClassName: nvidia
      resources:
        requests:
          cpu: "6"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
      pvcStorage: 20Gi
      pvcAccessMode:
        - ReadWriteOnce
      storageClass: local-path
      initContainer:
        name: model-cache
        image: MUST_BE_OVERRIDDEN_WITH_TAG_AND_DIGEST
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            snapshot="/data/hub/models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/${MODEL_REVISION}"
            if [ -e "${snapshot}/config.json" ] && [ -e "${snapshot}/model.safetensors" ]; then
              echo "model cache ready: ${snapshot}"
              exit 0
            fi
            HF_HOME=/data python3 -c 'import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id=os.environ["MODEL_ID"], revision=os.environ["MODEL_REVISION"], cache_dir="/data/hub")'
        env:
          - name: MODEL_ID
            value: Qwen/Qwen2.5-1.5B-Instruct
          - name: MODEL_REVISION
            value: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          - name: HF_HUB_DOWNLOAD_TIMEOUT
            value: "300"
        mountPvcStorage: true
      vllmConfig:
        enablePrefixCaching: true
        maxModelLen: 4096
        tensorParallelSize: 1
        maxNumSeqs: 16
        gpuMemoryUtilization: 0.9
        extraArgs:
          - --async-scheduling
          - --scheduler-cls
          - tinyinfer.scheduler.vllm_adapter.CustomAsyncFCFSScheduler
      enableLoRA: false
      lmcacheConfig:
        enabled: false
      keda:
        enabled: false
      env:
        - name: VTC_INFER_POLICY
          value: fcfs
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 90
    httpGet:
      path: /health
      port: 8000
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
    httpGet:
      path: /health
      port: 8000
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    httpGet:
      path: /health
      port: 8000

routerSpec:
  enableRouter: true
  repository: lmcache/lmstack-router
  tag: MUST_BE_OVERRIDDEN_WITH_TAG_AND_DIGEST
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  serviceType: ClusterIP
  servicePort: 80
  serviceDiscovery: k8s
  routingLogic: roundrobin
  autoscaling:
    enabled: false
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  resources:
    requests:
      cpu: 400m
      memory: 1Gi
    limits:
      memory: 1Gi
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
    httpGet:
      path: /health
      port: router-port

cacheserverSpec:
  enabled: false
loraController:
  enabled: false
grafanaDashboards:
  enabled: true
kube-prometheus-stack:
  enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: false
prometheus-adapter:
  enabled: false
